        * { margin: 0; padding: 0; box-sizing: border-box; }

            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #fff7ed 0%, #fef3c7 100%);
            min-height: 100vh;
        }
        .container { max-width: 500px; margin: 0 auto; padding: 20px; }
        .card { 
            background: white; 
            border-radius: 20px; 
            padding: 30px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .header {
            background: linear-gradient(135deg, #f97316 0%, #f59e0b 100%);
            color: white;
            padding: 20px;
            border-radius: 0;
            margin: 0 0 20px 0;
        }
        h1 { font-size: 2.5rem; margin-bottom: 10px; text-align: center; }
        h2 { font-size: 1.5rem; margin-bottom: 15px; }
        .emoji { font-size: 4rem; text-align: center; margin: 20px 0; }
        input, select, button, textarea {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
        }
        textarea { min-height: 100px; resize: vertical; }
        button {
            background: linear-gradient(135deg, #f97316 0%, #f59e0b 100%);
            color: white;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .grid-item {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);

            background: rgba(255,255,255,0.2);

            border-radius: 10px;
            text-align: center;
        }
        .back-btn {

            font-weight: bold;
            text-align: left;
            width: auto;
            padding: 10px 0;

        }
        .expense-item {
            background: #f9fafb;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid #e5e7eb;
        }
        .expense-item:hover { border-color: #f97316; }
        .delete-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .category-btn {
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #e5e7eb;
            background: white;
            cursor: pointer;
            text-align: center;
        }
        .category-btn.selected {
            border-color: #f97316;
            background: #fff7ed;
        }
        .lesson-card {
            background: #eff6ff;
            border: 2px solid #bfdbfe;
            padding: 20px;
            border-radius: 15px;
            margin: 15px 0;
        }
        .quiz-option {
            background: white;
            border: 2px solid #d1d5db;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
        }
        .quiz-option.selected {
            border-color: #f97316;
            background: #fff7ed;
        }
        .chat-container {
            height: 400px;
            overflow-y: auto;
            padding: 15px;
            background: #f9fafb;
            border-radius: 15px;
            margin-bottom: 15px;
        }
        .chat-message {
            margin-bottom: 15px;
            display: flex;
        }
        .chat-message.user {
            justify-content: flex-end;
        }
        .chat-bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 15px;
            line-height: 1.4;
        }
        .chat-bubble.user {
            background: #f97316;
            color: white;
        }
        .chat-bubble.bot {
            background: white;
            border: 2px solid #e5e7eb;
        }
        .chat-input-container {

            gap: 10px;
        }
        .chat-input-container input {
            flex: 1;
            margin: 0;
        }
        .chat-input-container button {
            width: auto;
            padding: 15px 25px;
            margin: 0;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 2px solid #e5e7eb;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            padding: 10px;
            box-shadow: 0 -4px 6px rgba(0,0,0,0.05);
        }
        .nav-item {
            text-align: center;
            padding: 10px;
            cursor: pointer;
            border-radius: 10px;
        }
        .nav-item.active {
            background: #fff7ed;
            color: #f97316;
        }
        .pb-nav { padding-bottom: 80px; }
        .hidden { display: none; }
        .alert-box {
            background: #fef2f2;
            border: 2px solid #fecaca;
            padding: 15px;
            border-radius: 10px;

            border-radius: 10px;

        .info-box {
            background: #eff6ff;
            border: 2px solid #bfdbfe;
            padding: 15px;

                return '💡 Try 50-30-20 budget! Save ₹100/day = ₹36,500/year! Check Learn tab for Smart Savings module.';

                return '📊 Budget tips: (1) List ALL expenses in My Money tab. (2) Separate needs vs wants. (3) Set limits. (4) Review weekly. Budget = control!';
            }
            
            if (msg.includes('emergency')) {

            }
            
            if (msg.includes('loan')) {

                return `💵 You spent ₹${total.toLocaleString()} of ₹${state.budget.toLocaleString()}. Remaining: ₹${remaining.toLocaleString()}!`;

                            <div style="font-size: 0.7rem; font-weight: bold;">${T.home}</div>
                        </div>
                        <div class="nav-item ${state.screen === 'expenses' ? 'active' : ''}" onclick="changeScreen('expenses')">
                            <div style="font-size: 1.5rem;">📊</div>
                            <div style="font-size: 0.7rem; font-weight: bold;">${T.spend}</div>
                        </div>
                        <div class="nav-item ${state.screen === 'learn' ? 'active' : ''}" onclick="changeScreen('learn')">
                            <div style="font-size: 1.5rem;">📚</div>
                            <div style="font-size: 0.7rem; font-weight: bold;">${T.learn}</div>
                        </div>
                        <div class="nav-item ${state.screen === 'help' ? 'active' : ''}" onclick="changeScreen('help')">
                            <div style="font-size: 1.5rem;">🆘</div>
                            <div style="font-size: 0.7rem; font-weight: bold;">${T.help}</div>
                        </div>
                        <div class="nav-item ${state.screen === 'chat' ? 'active' : ''}" onclick="changeScreen('chat')">
                            <div style="font-size: 1.5rem;">💬</div>
                            <div style="font-size: 0.7rem; font-weight: bold;">${T.ask}</div>
                        </div>
                    </div>
                `;
                
                document.getElementById('langSelectMain').value = state.lang;
                document.getElementById('langSelectMain').onchange = (e) => {
                    state.lang = e.target.value;
                    render();
                };
                
                renderScreen(T, lessonsData);
            }
        }

        function renderScreen(T, lessonsData) {
            const content = document.getElementById('mainContent');
            
            if (state.screen === 'home') {
                content.innerHTML = `
                    <div class="grid">
                        <div class="grid-item" onclick="changeScreen('expenses')">
                            <div style="font-size: 2.5rem; margin-bottom: 10px;">📊</div>
                            <div style="font-weight: bold;">${T.spend}</div>
                        </div>
                        <div class="grid-item" onclick="changeScreen('learn')">
                            <div style="font-size: 2.5rem; margin-bottom: 10px;">📚</div>
                            <div style="font-weight: bold;">${T.learn}</div>
                        </div>
                        <div class="grid-item" onclick="changeScreen('help')">
                            <div style="font-size: 2.5rem; margin-bottom: 10px;">🆘</div>
                            <div style="font-weight: bold;">${T.help}</div>
                        </div>
                        <div class="grid-item" onclick="changeScreen('chat')">
                            <div style="font-size: 2.5rem; margin-bottom: 10px;">💬</div>
                            <div style="font-weight: bold;">${T.ask}</div>
                        </div>
                    </div>
                `;
            } else if (state.screen === 'expenses') {
                const totalSpent = state.expenses.reduce((sum, exp) => sum + exp.amount, 0);
                const remaining = state.budget - totalSpent;
                
                content.innerHTML = `
                    <div class="card">
                        <h2>${T.spend}</h2>
                        
                        <div class="success-box">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                                <div>
                                    <div style="font-size: 0.9rem; color: #6b7280;">${T.total}</div>
                                    <div style="font-size: 1.5rem; font-weight: bold; color: #f97316;">₹${totalSpent.toLocaleString()}</div>
                                </div>
                                <div style="text-align: right;">
                                    <div style="font-size: 0.9rem; color: #6b7280;">${T.remaining}</div>
                                    <div style="font-size: 1.5rem; font-weight: bold; color: ${remaining >= 0 ? '#22c55e' : '#ef4444'};">₹${Math.abs(remaining).toLocaleString()}</div>
                                </div>
                            </div>
                            <div style="font-size: 0.8rem; color: #6b7280;">${T.budget}: ₹${state.budget.toLocaleString()}</div>
                        </div>
                        
                        ${state.expenses.length === 0 ? `
                            <div style="text-align: center; padding: 40px 20px; color: #9ca3af;">
                                <div style="font-size: 3rem; margin-bottom: 15px;">📊</div>
                                <p style="font-weight: bold;">${T.noExpenses}</p>
                            </div>
                        ` : state.expenses.map(exp => `
                            <div class="expense-item">
                                <div style="display: flex; align-items: center; gap: 15px;">
                                    <span style="font-size: 2rem;">${exp.icon}</span>
                                    <div>
                                        <div style="font-weight: bold;">${exp.category}</div>
                                        <div style="color: #6b7280; font-size: 0.9rem;">₹${exp.amount.toLocaleString()}</div>
                                    </div>
                                </div>
                                <button class="delete-btn" onclick="deleteExpense(${exp.id})">${T.delete}</button>
                            </div>
                        `).join('')}
                        
                        ${!state.showAddExpense ? `
                            <button onclick="toggleAddExpense(true)">${T.add}</button>
                        ` : `
                            <div style="background: #fff7ed; padding: 20px; border-radius: 15px; border: 2px solid #fdba74; margin-top: 20px;">
                                <h3 style="margin-bottom: 15px; font-size: 1.1rem;">${T.whatBuy}</h3>
                                <div class="grid-3">
                                    ${categories.map(cat => `
                                        <div class="category-btn ${state.newExpense.category === T[cat.key] ? 'selected' : ''}" onclick="selectCategory('${cat.key}', '${cat.icon}')">
                                            <div style="font-size: 2rem; margin-bottom: 5px;">${cat.icon}</div>
                                            <div style="font-size: 0.8rem; font-weight: bold;">${T[cat.key]}</div>
                                        </div>
                                    `).join('')}
                                </div>
                                
                                <h3 style="margin: 20px 0 10px; font-size: 1.1rem;">${T.howMuch}</h3>
                                <input type="number" id="expenseAmount" placeholder="500" value="${state.newExpense.amount}">
                                
                                <div style="display: flex; gap: 10px; margin-top: 15px;">
                                    <button onclick="addExpense()" style="flex: 1;">${T.save}</button>
                                    <button onclick="toggleAddExpense(false)" style="flex: 1; background: #6b7280;">${T.cancel}</button>
                                </div>
                            </div>
                        `}
                    </div>
                `;
            } else if (state.screen === 'chat') {
                content.innerHTML = `
                    <div class="card">
                        <h2>${T.chat}</h2>
                        
                        <div class="chat-container" id="chatContainer">
                            ${state.chatMessages.length === 0 ? `
                                <div style="text-align: center; padding: 60px 20px; color: #9ca3af;">
                                    <div style="font-size: 3rem; margin-bottom: 15px;">💬</div>
                                    <p style="font-weight: bold;">Ask me anything about money!</p>
                                </div>
                            ` : state.chatMessages.map(msg => `
                                <div class="chat-message ${msg.from}">
                                    <div class="chat-bubble ${msg.from}">${msg.text}</div>
                                </div>
                            `).join('')}
                        </div>
                        
                        <div class="chat-input-container">
                            <input type="text" id="chatInput" placeholder="${T.type}">
                            <button onclick="sendMessage()">${T.send}</button>
                        </div>
                    </div>
                `;
                
                document.getElementById('chatInput').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') sendMessage();
                });
            } else if (state.screen === 'help') {
                content.innerHTML = `
                    <div class="card">
                        <h2>${T.crisis}</h2>
                        
                        <div class="alert-box">
                            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                                <span style="font-size: 2rem;">🆘</span>
                                <h3 style="font-size: 1.2rem; color: #991b1b;">We're here to help!</h3>
                            </div>
                            <p style="color: #b91c1c; line-height: 1.5;">Describe your financial crisis and get help.</p>
                        </div>
                        
                        <textarea id="crisisInput" placeholder="${T.describe}"></textarea>
                        <button onclick="submitCrisis()">${T.submit}</button>
                        
                        <div id="crisisResponse"></div>
                    </div>
                `;
            } else if (state.screen === 'learn') {
                content.innerHTML = `
                    <div class="card">
                        <h2>${T.learn}</h2>
                        ${lessonsData.modules.map(m => `
                            <div class="grid-item" onclick="openModule(${m.id})" style="text-align: left; margin-bottom: 15px;">
                                <div style="display: flex; align-items: center; gap: 15px;">
                                    <span style="font-size: 2.5rem;">${m.icon}</span>
                                    <div>
                                        <div style="font-weight: bold; font-size: 1.1rem;">${m.title}</div>
                                        <div style="color: #6b7280; font-size: 0.9rem;">${m.lessons.length} ${T.lessons}</div>
                                    </div>
                                    <span style="margin-left: auto; font-size: 1.5rem;">→</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (state.screen === 'lesson' && state.currentModule) {
                const module = lessonsData.modules.find(m => m.id === state.currentModule);
                const lesson = module.lessons[state.lessonIndex];
                
                content.innerHTML = `
                    <button class="back-btn" onclick="changeScreen('learn')">${T.back}</button>
                    <div class="card">
                        <div class="emoji">${module.icon}</div>
                        <h2 style="text-align: center; margin-bottom: 10px;">${module.title}</h2>
                        <p style="text-align: center; color: #6b7280; margin-bottom: 20px;">${T.lesson} ${state.lessonIndex + 1} ${T.of} ${module.lessons.length}</p>
                        
                        ${state.score === null ? `
                            <div class="lesson-card">
                                <h3 style="margin-bottom: 15px; font-size: 1.2rem;">${lesson.title}</h3>
                                <p style="line-height: 1.6; color: #374151;">${lesson.content}</p>
                            </div>
                            
                            <div style="display: flex; gap: 10px; margin-top: 20px;">
                                <button onclick="prevLesson()" ${state.lessonIndex === 0 ? 'disabled' : ''}>${T.prev}</button>
                                ${state.lessonIndex < module.lessons.length - 1 
                                    ? `<button onclick="nextLesson()">${T.next}</button>`
                                    : `<button onclick="startQuiz()">🎯 ${T.quiz}</button>`
                                }
                            </div>
                        ` : `
                            <div style="text-align: center; padding: 30px; background: ${state.score >= 70 ? '#f0fdf4' : '#fff7ed'}; border-radius: 15px; border: 2px solid ${state.score >= 70 ? '#86efac' : '#fdba74'};">
                                <div style="font-size: 3rem; margin-bottom: 15px;">${state.score >= 70 ? '🎉' : '📚'}</div>
                                <h2 style="font-size: 2rem; margin-bottom: 10px;">${T.score}: ${state.score}%</h2>
                                <p style="font-size: 1.2rem; margin-bottom: 20px;">${state.score >= 70 ? 'Excellent!' : 'Good try!'}</p>
                                <button onclick="changeScreen('learn')">Done</button>
                            </div>
                        `}
                    </div>
                `;
            } else if (state.screen === 'quiz' && state.currentModule) {
                const module = lessonsData.modules.find(m => m.id === state.currentModule);
                
                content.innerHTML = `
                    <button class="back-btn" onclick="backToLesson()">${T.back}</button>
                    <div class="card">
                        <h2 style="margin-bottom: 20px;">${T.quiz}</h2>
                        ${module.quiz.map((q, i) => `
                            <div style="margin-bottom: 25px;">
                                <p style="font-weight: bold; margin-bottom: 12px;">Q${i+1}: ${q.q}</p>
                                ${q.options.map((opt, j) => `
                                    <div class="quiz-option ${state.quizAnswers[i] === j ? 'selected' : ''}" onclick="selectAnswer(${i}, ${j})">
                                        ${opt}
                                    </div>
                                `).join('')}
                            </div>
                        `).join('')}
                        <button onclick="submitQuiz()" style="background: #22c55e;">Check Answers</button>
                    </div>
                `;
            }
        }

        function startApp() {
            const name = document.getElementById('nameInput').value.trim();
            if (name) {
                state.name = name;
                state.screen = 'home';
                render();
            }
        }

        function changeScreen(screen) {
            state.screen = screen;
            render();
        }

        function toggleAddExpense(show) {
            state.showAddExpense = show;
            if (!show) state.newExpense = { category: '', amount: '', icon: '💰' };
            render();
        }

        function selectCategory(key, icon) {
            const T = translations[state.lang];
            state.newExpense.category = T[key];
            state.newExpense.icon = icon;
            render();
        }

        function addExpense() {
            const amount = document.getElementById('expenseAmount').value;
            if (state.newExpense.category && amount && parseInt(amount) > 0) {
                state.expenses.push({
                    id: Date.now(),
                    category: state.newExpense.category,
                    icon: state.newExpense.icon,
                    amount: parseInt(amount)
                });
                state.points += 2;
                state.level = Math.floor(state.points / 100) + 1;
                state.showAddExpense = false;
                state.newExpense = { category: '', amount: '', icon: '💰' };
                render();
            }
        }

        function deleteExpense(id) {
            state.expenses = state.expenses.filter(exp => exp.id !== id);
            render();
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (message) {
                state.chatMessages.push({ from: 'user', text: message });
                
                setTimeout(() => {
                    const reply = getSmartChatResponse(message);
                    state.chatMessages.push({ from: 'bot', text: reply });
                    render();
                    
                    setTimeout(() => {
                        const container = document.getElementById('chatContainer');
                        if (container) container.scrollTop = container.scrollHeight;
                    }, 100);
                }, 600);
                
                input.value = '';
                render();
            }
        }

        function submitCrisis() {
            const input = document.getElementById('crisisInput').value.trim();
            const response = document.getElementById('crisisResponse');
            
            if (input) {
                response.innerHTML = getCrisisResponse(input);
            }
        }

        function openModule(id) {
            state.currentModule = id;
            state.lessonIndex = 0;
            state.score = null;
            state.screen = 'lesson';
            render();
        }

        function nextLesson() {
            state.lessonIndex++;
            state.points += 5;
            state.level = Math.floor(state.points / 100) + 1;
            render();
        }

        function prevLesson() {
            if (state.lessonIndex > 0) {
                state.lessonIndex--;
                render();
            }
        }

        function startQuiz() {
            state.quizAnswers = {};
            state.screen = 'quiz';
            render();
        }

        function backToLesson() {
            state.screen = 'lesson';
            render();
        }

        function selectAnswer(questionIndex, optionIndex) {
            state.quizAnswers[questionIndex] = optionIndex;
            render();
        }

        function submitQuiz() {
            const lessonsData = getLessonsData(state.lang);
            const module = lessonsData.modules.find(m => m.id === state.currentModule);
            let correct = 0;
            module.quiz.forEach((q, i) => {
                if (state.quizAnswers[i] === q.correct) correct++;
            });
            state.score = Math.round((correct / module.quiz.length) * 100);
            state.points += state.score >= 70 ? 20 : 10;
            state.level = Math.floor(state.points / 100) + 1;
            state.screen = 'lesson';
            render();
        }

        render();
    </script>
</body>
</html>
